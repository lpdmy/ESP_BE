name: Build and Deploy esp-dev-api to Azure

on:
  push:
    branches:
      - "main"
      - "dev"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore ./EduShpere/EduShpere.csproj

      - name: Build
        run: dotnet build ./EduShpere/EduShpere.csproj --configuration Release --no-restore

      - name: Publish for Linux
        run: dotnet publish ./EduShpere/EduShpere.csproj -c Release -r linux-x64 --self-contained true -o ./publish

      - name: Deploy to Azure WebApp
        uses: azure/webapps-deploy@v2
        with:
          app-name: esp-dev-api
          slot-name: production
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
          enable-oryx-build: true   # log chi tiết, Azure rebuild nếu cần
