name: Build and Deploy esp-dev-api to Azure

on:
  push:
    branches:
      - "main"
      - "dev"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest  # cần Windows cho OR-Tools x64

    steps:
      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup .NET 8
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 3️⃣ Restore dependencies
      - name: Restore dependencies
        run: dotnet restore ./EduShpere/EduShpere.csproj

      # 4️⃣ Build project
      - name: Build
        run: dotnet build ./EduShpere/EduShpere.csproj --configuration Release --no-restore

      # 5️⃣ Clean publish folder
      - name: Clean publish folder
        run: |
          if (Test-Path -Path "./publish") {
            Remove-Item -Recurse -Force "./publish"
          }

      # 6️⃣ Publish project for Windows x64
      - name: Publish
        run: |
          dotnet publish ./EduShpere/EduShpere.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -o ./publish `
            /p:ExcludeAppHost=true `
            /p:PublishTrimmed=false

      # 7️⃣ Deploy to Azure WebApp
      - name: Deploy to Azure WebApp
        uses: azure/webapps-deploy@v2
        with:
          app-name: esp-dev-api
          slot-name: production
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
