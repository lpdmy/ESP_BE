name: Build and Deploy EduShpere API to EC2

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup .NET 8
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 3️⃣ Restore dependencies
      - name: Restore dependencies
        run: dotnet restore ./EduShpere/EduShpere.csproj

      # 4️⃣ Build project
      - name: Build
        run: dotnet build ./EduShpere/EduShpere.csproj --configuration Release --no-restore

      # 5️⃣ Publish project
      - name: Publish
        run: dotnet publish ./EduShpere/EduShpere.csproj -c Release -o ./publish

      # 6️⃣ Deploy to EC2 via SSH
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.EC2_PUBLIC_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # ⚡ Add EC2 host to known_hosts to avoid SSH verification errors
            mkdir -p ~/.ssh
            ssh-keyscan -H ${{ secrets.EC2_PUBLIC_IP }} >> ~/.ssh/known_hosts

            # 1️⃣ Tạo folder deploy nếu chưa có + backup
            sudo mkdir -p /var/www/esp-api
            sudo mkdir -p /var/www/esp-api-backup
            if [ -d "/var/www/esp-api" ]; then
              sudo cp -r /var/www/esp-api /var/www/esp-api-backup/$(date +%F_%H-%M-%S)
            fi

            # 2️⃣ Stop service trước khi deploy
            sudo systemctl stop espapi || true

            # 3️⃣ Copy file publish từ runner lên EC2
            rsync -avz --delete ./publish/ ec2-user@${{ secrets.EC2_PUBLIC_IP }}:/var/www/esp-api/

            # 4️⃣ Chỉnh quyền an toàn cho folder
            sudo chown -R ec2-user:ec2-user /var/www/esp-api
            sudo chmod -R 755 /var/www/esp-api

            # 5️⃣ Start service lại
            sudo systemctl start espapi
            sudo systemctl status espapi --no-pager

            # 6️⃣ Kiểm tra port 5000 listen
            sudo ss -tulwn | grep 5000
