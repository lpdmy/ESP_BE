name: Build and Deploy EduShpere API

on:
  push:
    branches:
      - "*"     # chạy trên mọi nhánh, nếu chỉ muốn main thì đổi thành: main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        run: |
          # gắn tag theo nhánh hiện tại và commit SHA để trace version dễ hơn
          IMAGE_TAG=${{ github.ref_name }}-${{ github.sha }}
          IMAGE_NAME=${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/esp-dev-api

          echo "Building image: $IMAGE_NAME:$IMAGE_TAG"
          docker build -t $IMAGE_NAME:$IMAGE_TAG .
          docker push $IMAGE_NAME:$IMAGE_TAG

          # cũng push thêm latest cho Web App
          docker tag $IMAGE_NAME:$IMAGE_TAG $IMAGE_NAME:latest
          docker push $IMAGE_NAME:latest

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: "esp-dev-api"   # Tên Web App trên Azure
          images: "${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/esp-dev-api:latest"