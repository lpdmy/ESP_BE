name: Build and Deploy EduShpere API to EC2

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup .NET 8
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 3️⃣ Restore dependencies
      - name: Restore dependencies
        run: dotnet restore ./ESP.BE/EduShpere/EduShpere.csproj

      # 4️⃣ Build project
      - name: Build
        run: dotnet build ./ESP.BE/EduShpere/EduShpere.csproj --configuration Release --no-restore

      # 5️⃣ Publish project
      - name: Publish
        run: dotnet publish ./ESP.BE/EduShpere/EduShpere.csproj -c Release -o ./publish

      # 6️⃣ Copy publish folder lên EC2
      - name: Copy publish folder to EC2
        uses: appleboy/scp-action@v0.1.1
        with:
          host: ${{ secrets.EC2_PUBLIC_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "./publish/*"
          target: "/var/www/esp-api/"
          strip_components: 0

      # 7️⃣ Restart service trên EC2
      - name: Restart espapi service on EC2
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.EC2_PUBLIC_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # 1️⃣ Tạo folder backup nếu chưa có
            sudo mkdir -p /var/www/esp-api-backup
            # 2️⃣ Backup folder cũ
            if [ -d "/var/www/esp-api" ]; then
              sudo cp -r /var/www/esp-api /var/www/esp-api-backup/$(date +%F_%H-%M-%S)
            fi
            # 3️⃣ Stop service trước khi deploy
            sudo systemctl stop espapi || true
            # 4️⃣ Start service lại
            sudo systemctl start espapi
            sudo systemctl status espapi --no-pager
            # 5️⃣ Kiểm tra port 5000 đang listen
            sudo ss -tulwn | grep 5000
