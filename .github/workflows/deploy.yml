name: Build and Deploy EduShpere API to EC2

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup .NET 8
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 3️⃣ Restore dependencies
      - name: Restore dependencies
        run: dotnet restore ./EduShpere/EduShpere.csproj

      # 4️⃣ Build project
      - name: Build
        run: dotnet build ./EduShpere/EduShpere.csproj --configuration Release --no-restore

      # 5️⃣ Publish project
      - name: Publish
        run: dotnet publish ./EduShpere/EduShpere.csproj -c Release -o ./publish

      # 6️⃣ Copy publish folder từ runner lên EC2
      - name: Copy publish folder to EC2
        uses: appleboy/scp-action@v0.1.1
        with:
          host: ${{ secrets.EC2_PUBLIC_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "./publish/*"
          target: "/var/www/esp-api"
          rm: true        # xóa folder cũ trước khi copy
          overwrite: true

      # 7️⃣ Restart espapi service
      - name: Restart espapi service
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.EC2_PUBLIC_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # Tạo folder backup nếu chưa có
            sudo mkdir -p /var/www/esp-api-backup
            # Backup folder cũ với timestamp
            if [ -d "/var/www/esp-api" ]; then
              sudo cp -r /var/www/esp-api /var/www/esp-api-backup/$(date +%F_%H-%M-%S)
            fi
            # Restart service
            sudo systemctl restart espapi
            # Kiểm tra status
            sudo systemctl status espapi --no-pager
