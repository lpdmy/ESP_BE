name: Build and Deploy EduShpere API to EC2

on:
  push:
    branches:
      - dev          # chỉ chạy trên nhánh dev
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup .NET 8
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 3️⃣ Restore dependencies
      - name: Restore dependencies
        run: dotnet restore ./EduShpere/EduShpere.csproj

      # 4️⃣ Build project
      - name: Build
        run: dotnet build ./EduShpere/EduShpere.csproj --configuration Release --no-restore

      # 5️⃣ Publish project
      - name: Publish
        run: dotnet publish ./EduShpere/EduShpere.csproj -c Release -o ./publish

      # 6️⃣ Deploy to EC2
      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.EC2_PUBLIC_IP }}    # Public IP EC2
          username: ec2-user                    # user deploy trên EC2
          key: ${{ secrets.EC2_SSH_KEY }}       # private key từ GitHub Secrets
          port: 22
          sync: true                             # ✅ sync folder
          overwrite: true                        # ✅ ghi đè file cũ
          rm: true                               # ✅ xóa tar temp
          source: "./publish/"                   # folder publish local
          target: "/var/www/esp-api"             # folder deploy trên EC2
          script: |
            # Tạo folder backup nếu chưa có
            sudo mkdir -p /var/www/esp-api-backup || true
            # Backup folder cũ với timestamp
            sudo cp -r /var/www/esp-api /var/www/esp-api-backup/$(date +%F_%H-%M-%S) || true
            # Stop service trước khi deploy
            sudo systemctl stop espapi || true
            # Start service lại
            sudo systemctl start espapi
            # Kiểm tra status
            sudo systemctl status espapi --no-pager
