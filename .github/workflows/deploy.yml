name: Build and Deploy esp-dev-api to Azure

on:
  push:
    branches:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore ./EduSphere/EduSphere.csproj

      - name: Build
        run: dotnet build ./EduSphere/EduSphere.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ./EduSphere/EduSphere.csproj -c Release -o ./publish

      - name: Deploy to Azure WebApp
        uses: azure/webapps-deploy@v2
        with:
          app-name: esp-dev-api
          slot-name: production
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
